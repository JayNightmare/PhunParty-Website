name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_DEV: ${{ secrets.VITE_DEV }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('VITE_API_URL',''); print('BYTES_VITE_API_URL=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_DEV',''); print('BYTES_VITE_DEV=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_WS_URL',''); print('BYTES_VITE_WS_URL=' + ','.join(str(b) for b in v.encode()))"
